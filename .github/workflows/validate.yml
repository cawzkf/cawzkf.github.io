name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sintaxe do JavaScript
        run: node --check script.js

      - name: HTML
        run: npx --yes html-validate@9 index.html

      - name: i18n, arquivos locais e links
        run: node scripts/validate.mjs
