<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Camila Félix dos Reis | Social preview</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: #000; color: #fff7f6; padding: 48px; font-family: "Space Grotesk", sans-serif; }
    .window { height: 534px; border: 1px solid #2b2b2b; border-radius: 5px; background: #0c0c0c; overflow: hidden; }
    .bar { height: 46px; border-bottom: 1px solid #2b2b2b; background: #151515; font: 400 14px "JetBrains Mono", monospace; color: #a4a4a4; display: flex; align-items: center; padding: 0 24px; }
    .body { position: relative; padding: 32px; }
    .prompt { font: 400 16px "JetBrains Mono", monospace; margin: 0 0 32px; }
    .green { color: #16c60c; }
    .cyan { color: #61d6d6; }
    h1 { font-size: 43px; font-weight: 600; letter-spacing: -1.5px; margin: 0 0 18px; }
    .role { color: #a4a4a4; font: 400 17px/1.8 "JetBrains Mono", monospace; margin: 0 0 24px; max-width: 720px; }
    .fields { font: 400 18px/1.9 "JetBrains Mono", monospace; color: #16c60c; margin: 0; }
    .url { font: 400 15px "JetBrains Mono", monospace; color: #a4a4a4; margin: 32px 0 0; }
    img { position: absolute; width: 190px; height: 190px; top: 96px; right: 32px; object-fit: cover; object-position: center top; filter: grayscale(.35) contrast(1.05); border: 1px solid #2b2b2b; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="window">
    <div class="bar" aria-hidden="true">~/whoami</div>
    <div class="body">
      <p class="prompt"><span class="cyan">~</span> <span class="green">❯</span> whoami --verbose</p>
      <h1>Camila Félix dos Reis</h1>
      <p class="role">Computer Engineering student<br>Software Developer (Back-end) · R&amp;D scholarship holder</p>
      <p class="fields">Cyber-Physical &amp; Embedded Systems<br>Digital Twins • E-Mobility • R&amp;D @ UEA</p>
      <p class="url">cawzkf.github.io</p>
      <img src="../camila.webp" alt="Camila Félix dos Reis" width="190" height="190">
    </div>
  </main>
</body>
</html>
